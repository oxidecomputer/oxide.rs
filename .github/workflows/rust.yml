#
# Configuration for GitHub-based CI, based on the stock GitHub Rust config.
#
name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Report cargo version
        run: cargo --version
      - name: Report rustfmt version
        run: cargo fmt -- --version
      - name: Check style
        run: cargo fmt -- --check

  clippy-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Report cargo version
        run: cargo --version
      - name: Report Clippy version
        run: cargo clippy -- --version
      - name: Run Clippy Lints
        # Clippy's style nits are useful, but not worth keeping in CI.  This
        # override belongs in src/lib.rs, but that doesn't reliably work due to
        # rust-lang/rust-clippy#6610.
        run: cargo clippy --all-targets -- --deny warnings --allow clippy::style

  check-generation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc --version
      - name: Check generation
        run: cargo xtask generate --check

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, windows-11-arm, macos-latest]
        features: [ all, default ]
        include:
          - features: all
            feature_flags: --all-features
    steps:
      - uses: actions/checkout@v4
      # TODO-RAINCLAUDE: without this, windows-11-arm builds and tests an emulated x64 binary; keep in sync with .github/build-setup.yml
      - name: Use native aarch64 Rust toolchain on Windows ARM64
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: rustup set default-host aarch64-pc-windows-msvc
      - name: Report cargo version
        run: cargo --version
      - name: Report rustc version
        run: rustc -vV
      - name: Build
        run: cargo build ${{ matrix.feature_flags }} --locked --all-targets --verbose
      - name: Run tests
        run: cargo test ${{ matrix.feature_flags }} --locked --verbose
        env:
          RUST_BACKTRACE: 1
